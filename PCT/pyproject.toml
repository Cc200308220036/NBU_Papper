[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pct-baseline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools.package-data]
pct_baseline = ["schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
