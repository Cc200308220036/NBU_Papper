# O4-D: same model/parameters for text and image. Keys are read only from env.
endpoint: https://api.deepseek.com/chat/completions
model: deepseek-flash
api_key_env: DEEPSEEK_API_KEY
thinking: disabled
temperature: 0.0
max_tokens: 8192
timeout_s: 90.0
# Local conservative caps; never silently drop or resize images.
max_images: 16
max_image_bytes: 10000000
max_image_pixels: 16000000
max_image_side: 8192
max_request_bytes: 30000000
max_response_bytes: 4000000
